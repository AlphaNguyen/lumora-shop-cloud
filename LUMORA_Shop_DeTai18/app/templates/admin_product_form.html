{% extends 'base.html' %}{% block title %}{% if product %}Chỉnh sửa{% else %}Thêm{% endif %} sản phẩm | LUMORA{% endblock %}{% block content %}<section class="shell page-spacing admin-page"><div class="page-heading"><span class="eyebrow">PRODUCT EDITOR</span><h1>{% if product %}Chỉnh sửa{% else %}Thêm mới{% endif %} <em>sản phẩm.</em></h1></div>{% include '_admin_nav.html' %}<div class="form-panel"><form method="post" action="/quan-tri/san-pham/luu" class="stack-form"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="id" value="{{ product.id if product else 0 }}"><label>Tên sản phẩm<input type="text" name="name" minlength="2" maxlength="180" required value="{{ product.name if product else '' }}"></label><label>Mô tả sản phẩm<textarea name="description" rows="4" maxlength="3000">{{ product.description if product else '' }}</textarea></label><div class="form-row"><label>Danh mục<select name="category_id" required>{% for c in categories %}<option value="{{ c.id }}" {% if product and c.id == product.category_id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></label><label>Biểu tượng minh họa<input name="image_symbol" maxlength="12" value="{{ product.image_symbol if product else '📦' }}" placeholder="🎧"></label></div><div class="form-row"><label>Giá bán (VNĐ)<input type="number" name="price" min="1000" max="1000000000" required value="{{ product.price if product else 100000 }}"></label><label>Giá gốc (tùy chọn)<input type="number" name="old_price" min="0" value="{{ product.old_price if product and product.old_price else 0 }}"></label></div><div class="form-row"><label>Tồn kho<input type="number" name="stock" min="0" max="100000" required value="{{ product.stock if product else 10 }}"></label><label>Phong cách ảnh<select name="image_color">{% for color in ['lavender','peach','sky','mint','lemon'] %}<option value="{{ color }}" {% if product and product.image_color == color %}selected{% endif %}>{{ color|capitalize }}</option>{% endfor %}</select></label></div><div class="check-row"><label><input type="checkbox" name="featured" {% if product and product.featured %}checked{% endif %}> Sản phẩm nổi bật</label><label><input type="checkbox" name="is_active" {% if not product or product.is_active %}checked{% endif %}> Hiển thị trên website</label></div><div class="form-actions"><button type="submit" class="btn btn-dark">Lưu sản phẩm →</button><a href="/quan-tri/san-pham" class="btn btn-outline">Hủy</a></div></form></div></section>{% endblock %}
