
services:
  - type: web
    name: lumora-shop-18
    runtime: python
    plan: free
    rootDir: LUMORA_Shop_DeTai18
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: lumora-shop-db-18
          property: connectionString
      - key: ENABLE_DEMO_ACCOUNTS
        value: "0"
      # Sau khi tạo Blueprint, thêm ADMIN_EMAIL và ADMIN_PASSWORD trong dashboard Render.
databases:
  - name: lumora-shop-db-18
    plan: free
    databaseName: lumorashop
    
    user: lumora
